databases:
  - name: resolviq-db
    plan: free

services:
  - type: web
    name: resolviq-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolviq-db
          property: connectionString
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: resolviq-frontend
          property: url
      - key: DEMO_API_KEY
        sync: false

  - type: web
    name: resolviq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resolviq-api
          property: url
      - key: VITE_DEMO_API_KEY
        sync: false
      - key: VITE_DEMO_USER
        value: demo@resolviq.local
